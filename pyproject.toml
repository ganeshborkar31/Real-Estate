[project]
name = "real-estate-starter"
version = "0.1.0"
description = "Reusable real-estate API starter with FastAPI, Alembic, Redis, and monitoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "python-dotenv==1.0.1",
  "pydantic-settings==2.6.1",
  "email-validator==2.2.0",
  "httpx==0.27.2",
  "twilio==9.3.2",
  "PyJWT==2.9.0",
  "passlib[bcrypt]==1.7.4",
  "sqlalchemy==2.0.36",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "prometheus-client==0.21.0",
  "prometheus-fastapi-instrumentator==7.0.0",
  "redis==5.2.1",
  "supabase==2.7.4",
  "pinecone==5.3.1",
  "aiosqlite==0.20.0",
  "pytest-asyncio==0.24.0",
  "pytest==8.3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
